#true: para la conexión HTTP se utilizará el almacén de
#certificados definido en el parámetro Truststore.path.
#false (valor por defecto): se utilizará el almacén de
#certificados configurado en la máquina virtual de Java (si
#lo hay).
#Truststore.active=true

#Almacén de certificados que se utilizará en la conexión
#HTTP (si el valor de Truststore.active es true).
#Truststore.path=resources/trustedx-des-truststore.jks
#Truststore.path=C:/desarrollo/workspace_zain/zain-smartwrapper-samples-3_0/resources/zain-truststore-des-2ik_4k.jks
#Truststore.path=/fileTransfer/login/resources/zain-truststore-des-2ik_4k.jks

#Contraseña del almacén de certificados definido en Truststore.path.
#Truststore.password=trustedx
#Truststore.password=zainzain

#-----------------------------------------------------------#

#true: para la conexión HTTPS se utilizará el almacén de
#claves definido en el parámetro Keystore.path.
#false (valor por defecto): se utilizará el almacén de
#claves configurado en la máquina virtual de Java (si lo
#hay).
#Keystore.active=true

#Almacén de claves utilizado en la conexión HTTPS (si el
#valor de Keystore.active es true).
#Keystore.path=## PATH AL KEYSTORE DE AUTENTICACIÓN ##
#Keystore.path=C:/desarrollo/workspace_zain/zain-smartwrapper-samples-3_0/resources
#Keystore.path=C:/desarrollo/workspace_zain/signupdateKit/resources/izenpe-certificado-exportado-gcsc.p12
#Keystore.path=/fileTransfer/login/resources/izenpe-certificado-exportado-gcsc.p12

#Contraseña del almacén de claves definido en Keystore.path.
#Keystore.password=1234567890

#Tipo de keystore utilizado (JKS o PKCS12)
#Keystore.type=PKCS12

#-----------------------------------------------------------#

#true: para la conexión HTTP se utilizará un servidor Proxy.
#false: no se utilizará un servidor proxy.
Proxy.active=false

#Servidor proxy utilizado (si el valor de Proxy.active es
#true).
Proxy.host=

#Puerto del servidor proxy.
Proxy.port=

#Nombre de usuario para acceder al servidor proxy (si
#requiere autenticación HTTP básica).
Proxy.username=

#Contraseña para acceder al servidor proxy (si requiere
#autenticación HTTP básica).
Proxy.password=

#-----------------------------------------------------------#

#Tiempo de espera de la conexión HTTP (en milisegundos).
Timeout=90000

#-----------------------------------------------------------#

#Directorio base de los archivos creados para enviar con
#las peticiones cuando se manejen datos de gran tamaño.
Request.loadPath=

#Directorio base de los archivos creados al recibir
#respuestas cuando se manejan datos de gran tamaño
Response.savePath=

#-----------------------------------------------------------#

#true: las peticiones SOAP enviadas a TrustedX se
#guardarán en archivos de log.
#false (valor por defecto): las peticiones SOAP enviadas
#a TrustedX no se guardarán en archivos de log.
#req-log.active=true

#Directorio donde se guardarán los archivos de log con las
#peticiones enviadas a TrustedX (si el valor de reqlog.
#active es true).
#req-log.savePath=/fileTransfer/login/soap-messages/req/

#-----------------------------------------------------------#

#true: se guardarán archivos de log con el contenido de
#las respuestas enviadas por TrustedX.
#false (valor por defecto): no se guardarán archivos de
#log con el contenido de las respuestas.
#res-log.active=true

#Directorio donde se guardarán los archivos de log con las
#respuestas enviadas por TrustedX (si el valor de reslog.
#active es true).
#res-log.savePath=./soap-messages/response/
#res-log.savePath=C:/desarrollo/bitbucket/jboss-eap-quickstarts-7.2.0.GA/helloworld-mutual-ssl/soap-messages/response/
#res-log.savePath=/fileTransfer/login/soap-messages/res/

